<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#0a5fd6"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- clipboard board -->
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="128" height="148" rx="16" fill="url(#board)"/>
  </g>

  <!-- clip -->
  <rect x="98" y="48" width="60" height="30" rx="10" fill="#1e2a3a"/>
  <rect x="112" y="40" width="32" height="18" rx="9" fill="#1e2a3a"/>
  <rect x="104" y="60" width="48" height="12" rx="4" fill="#3a4a60"/>

  <!-- text lines -->
  <rect x="86" y="106" width="84" height="12" rx="6" fill="#0a5fd6" opacity="0.85"/>
  <rect x="86" y="134" width="64" height="12" rx="6" fill="#0a5fd6" opacity="0.55"/>
  <rect x="86" y="162" width="76" height="12" rx="6" fill="#0a5fd6" opacity="0.35"/>

  <!-- history "stack" hint -->
  <rect x="150" y="150" width="56" height="56" rx="14" fill="#1e2a3a"/>
  <path d="M178 162v16h12" fill="none" stroke="#4cc2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="178" cy="178" r="20" fill="none" stroke="#4cc2ff" stroke-width="7"/>
</svg>
